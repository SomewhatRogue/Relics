<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Relic</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="unit">
        <button class="face" aria-label="Your hero: tap for your weapon"><canvas width="14" height="12"></canvas><b class="lv"></b></button>
        <div class="col">
          <div class="who">WARRIOR</div>
          <div class="bar hp"><b class="trail"></b><i></i></div>
          <button class="ups" hidden aria-label="How many more times you can get back up on this job"></button>
          <div class="bar st"><i></i></div>
          <div class="buffs"><div class="litbadge" hidden>LIT</div></div>
        </div>
      </div>
      <div class="sheet">
        <div class="gear"><span class="wpn"></span></div>
        <div class="gear kit"></div>
        <div class="gear"><span class="rlc"></span><b class="rcd"></b></div>
        <div class="gear belt"></div>
      </div>
    </div>
    <div id="corner">
      <button id="packbtn" aria-label="Your pack">PACK</button>
      <button id="opts" aria-label="Options" aria-expanded="false"></button>
    </div>
    <div id="options" hidden>
      <button id="heroes" aria-label="Your heroes">HEROES</button>
      <button id="mute" aria-label="Sound on or off">SOUND</button>
      <button id="music" aria-label="Music on or off">MUSIC</button>
      <button id="tips" aria-label="Tips on or off" class="off">TIPS</button>
      <button id="legendbtn" aria-label="What the buttons mean">BUTTONS</button>
      <button id="leave" aria-label="Leave the job">LEAVE</button>
      <p id="netmeter" hidden></p>
    </div>
    <div id="banner"></div>
    <div id="boss" hidden><b></b><div class="bar"><i></i></div></div>
    <div id="tip"></div>
    <div id="prompt" hidden></div>
    <div id="caption" hidden></div>
    <button id="skipcut" hidden>SKIP</button>
    <div id="bars"><i></i><i></i></div>
    <div id="touch" hidden>
      <div class="stick-zone"></div>
      <div class="stick"><div class="knob"></div></div>
      <button class="tb roll">ROLL</button>
      <button class="tb block">BLOCK</button>
      <button class="tb attack">ATTACK</button>
      <button class="tb relic">SKILL</button>
      <button class="tb relic2" hidden>RELIC</button>
      <button class="tb potion" hidden>POTION</button>
      <button class="tb grab" hidden>GRAB</button>
      <button class="tb use" hidden>USE</button>
      <button class="tb reload" hidden>RELOAD</button>
      <button class="tb element" hidden>ELEMENT</button>
      <button class="tb sign" hidden>SIGN</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
